version: "3.9"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: certiwatch
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      - postgres
      - redis
    environment:
      # Defaults to Development so local Docker keeps working exactly as before with no .env
      # changes. When this stack is actually deployed somewhere, set ASPNETCORE_ENVIRONMENT=
      # Production in .env - that also disables the dev-only auto-admin-login bypass and Swagger
      # UI in Program.cs, and switches on the MagicLinks__Secret startup check below.
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__postgres: Host=postgres;Username=postgres;Password=postgres;Database=certiwatch
      MagicLinks__BaseUrl: http://localhost:3300
      # "dev-secret" is a known placeholder the API refuses to start with outside Development
      # (see Program.cs) - set a real random value in .env as MagicLinks__Secret before ever
      # setting ASPNETCORE_ENVIRONMENT=Production.
      MagicLinks__Secret: ${MagicLinks__Secret:-dev-secret}
      Stripe__SecretKey: ${Stripe__SecretKey:-sk_test_xxx}
      Stripe__WebhookSecret: ${Stripe__WebhookSecret:-whsec_xxx}
      Stripe__MagicLinks__BaseUrl: ${Stripe__MagicLinks__BaseUrl:-http://localhost:3300}
      Stripe__SuccessUrl: http://localhost:3300/signup/success
      Stripe__CancelUrl: http://localhost:3300/signup
      Stripe__TrialDays: 7
      Stripe__Plans__0__PlanId: starter
      Stripe__Plans__0__PriceId: ${Stripe__Plans__0__PriceId:-price_starter}
      Stripe__Plans__0__DisplayName: Starter
      Stripe__Plans__0__RecordLimit: 300
      Stripe__Plans__1__PlanId: growth
      Stripe__Plans__1__PriceId: ${Stripe__Plans__1__PriceId:-price_growth}
      Stripe__Plans__1__DisplayName: Growth
      Stripe__Plans__1__RecordLimit: 1500
      Stripe__Plans__2__PlanId: pro
      Stripe__Plans__2__PriceId: ${Stripe__Plans__2__PriceId:-price_pro}
      Stripe__Plans__2__DisplayName: Pro
      Stripe__Plans__2__RecordLimit: 0
      Email__FromAddress: ${Email__FromAddress:-hello@salisu.dev}
      Email__FromName: ${Email__FromName:-CertiWatch}
      # No SmtpHost default: EmailService treats an empty host as "log the email instead of
      # sending it" (see apps/api/Infrastructure/Services/EmailService.cs). Defaulting this to
      # smtp.resend.com with a placeholder re_XXXX password meant every send silently failed
      # against Resend's real server with a fake API key unless you'd already set up an account -
      # set these three in .env only once you actually have real SMTP/Resend credentials.
      Email__SmtpHost: ${Email__SmtpHost:-}
      Email__SmtpPort: ${Email__SmtpPort:-587}
      Email__SmtpUsername: ${Email__SmtpUsername:-}
      Email__SmtpPassword: ${Email__SmtpPassword:-}
      Email__SmtpEncryption: ${Email__SmtpEncryption:-starttls}
      Storage__UploadsRoot: /uploads
      # "Disk" (default) keeps every uploaded file, support attachment, and invoice archive on
      # this local volume - fine for local dev, but a single-box disk with no offsite backup for
      # customer compliance documents. Set to "R2" once Storage__R2__* below are filled in with
      # real Cloudflare R2 credentials (see the migration endpoint,
      # POST /api/platform/storage/migrate-to-r2, to move files already on disk into the bucket
      # before flipping this).
      Storage__Provider: ${Storage__Provider:-Disk}
      Storage__R2__AccountId: ${Storage__R2__AccountId:-}
      Storage__R2__AccessKeyId: ${Storage__R2__AccessKeyId:-}
      Storage__R2__SecretAccessKey: ${Storage__R2__SecretAccessKey:-}
      Storage__R2__BucketName: ${Storage__R2__BucketName:-}
      # CertiWatch's own OAuth app registrations (not per-tenant) for the Sources page's "Connect
      # Google Drive"/"Connect Microsoft OneDrive" buttons - see apps/api/Features/Sources/
      # SourceOAuthEndpoints.cs. Leave unset and those buttons will 503 with a clear message
      # instead of silently failing partway through the flow.
      GoogleOAuth__ClientId: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GoogleOAuth__ClientSecret: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GoogleOAuth__RedirectUri: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:5002/api/sources/oauth/google/callback}
      MicrosoftOAuth__ClientId: ${MICROSOFT_OAUTH_CLIENT_ID:-}
      MicrosoftOAuth__ClientSecret: ${MICROSOFT_OAUTH_CLIENT_SECRET:-}
      MicrosoftOAuth__RedirectUri: ${MICROSOFT_OAUTH_REDIRECT_URI:-http://localhost:5002/api/sources/oauth/microsoft/callback}
    ports:
      - "5002:8080"
    volumes:
      - ./uploads:/uploads
      - ./samples/documents:/samples/documents:ro
      # Read-only: the API only needs to read a cloud-imported file once, to archive it into
      # IFileStorage (see DocumentIngestionWorker.ArchiveDocumentIfNeededAsync) - without this
      # mount at all, that path doesn't exist inside this container, File.Exists on it is always
      # false, and the document silently never gets archived. Its PathOrUrl was then left pointing
      # at a path that only ever existed inside the *worker* container, which a later preview/
      # download request would try to read as if it were an R2 object key - producing an unhandled
      # Amazon.Runtime.Internal.HttpErrorResponseException instead of the actual file.
      - ./cloud-import:/tmp/cloud-import:ro

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    depends_on:
      api:
        condition: service_started
      paddleocr:
        condition: service_healthy
    environment:
      WORKER__DeepSeekApiKey: ${DEEPSEEK_API_KEY:-}
      WORKER__DeepSeekBaseUrl: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      WORKER__ApiBaseUrl: http://api:8080
      # Only used if DoctrBaseUrl (below) is ever unset - Doctr is the real, always-on OCR engine
      # here. Free key from https://ocr.space/ocrapi, set in .env as WORKER__OcrSpaceApiKey.
      WORKER__OcrSpaceApiKey: ${WORKER__OcrSpaceApiKey:-}
      # Enroll a device (see README "Docker quickstart") to get a real id/token pair, then set
      # them in .env as WORKER__DeviceId / WORKER__DeviceToken - do not hardcode real values here.
      WORKER__DeviceId: ${WORKER__DeviceId:-}
      WORKER__DeviceToken: ${WORKER__DeviceToken:-}
      # Not a secret, but kept overridable rather than hardcoded to one real tenant - this local
      # worker/device pairing can be pointed at whichever tenant you're actually testing against
      # (set WORKER__DeviceId/DeviceToken/TenantId together in .env for a real enrolled device;
      # they must all belong to the same tenant or ingestion will reject everything).
      WORKER__TenantId: ${WORKER__TenantId:-aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa}
      WORKER__DoctrBaseUrl: ${WORKER__DoctrBaseUrl:-http://paddleocr:8000}
      # Same OAuth app credentials as the api service above - the worker needs them too, since
      # refreshing a tenant's Google/Microsoft access token requires the app's client_id/secret
      # alongside their stored refresh token, not just the refresh token on its own.
      WORKER__GoogleOAuthClientId: ${GOOGLE_OAUTH_CLIENT_ID:-}
      WORKER__GoogleOAuthClientSecret: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      WORKER__MicrosoftOAuthClientId: ${MICROSOFT_OAUTH_CLIENT_ID:-}
      WORKER__MicrosoftOAuthClientSecret: ${MICROSOFT_OAUTH_CLIENT_SECRET:-}
      DOTNET_ENVIRONMENT: Development
      WORKER__EnableWatcher: "true"
      WORKER__EnableSampleDocuments: "false"
      # Default is 5 - shortened for local dev so a Sources connect/reconnect doesn't leave the
      # status looking "stuck" on queued for up to 5 silent minutes before the first real check.
      WORKER__CloudImportPollMinutes: ${WORKER__CloudImportPollMinutes:-1}
    volumes:
      # Was :ro (read-only) - the worker only ever needed to read here to OCR a file, until
      # cleanup-after-processing was added so a deleted record can't silently reappear on the next
      # restart (see OcrWorker.TryDeleteProcessedFile). Samples stay read-only since they're seed
      # data the worker should never remove.
      - ./uploads:/uploads
      - ./samples/documents:/samples/documents:ro
      # Read-write: CloudImportWorker downloads Google Drive/OneDrive files here, and OcrWorker
      # deletes them from here once fully processed. Bind-mounted (rather than a bare container
      # path) so the API container can also see the same files under this same path - see the
      # matching mount on the api service for why that matters.
      - ./cloud-import:/tmp/cloud-import

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        # Use host-exposed API so browser calls succeed
        NEXT_PUBLIC_API_BASE_URL: http://localhost:5002
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-pk_test_xxx}
        # Both blank by default - the Google Drive folder picker (sources/page.tsx) falls back to
        # the manual "paste a folder ID" input when these aren't set, so local dev works with no
        # Google Cloud project of its own.
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_GOOGLE_PICKER_API_KEY: ${NEXT_PUBLIC_GOOGLE_PICKER_API_KEY:-}
    depends_on:
      - api
      - worker
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:5002
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-pk_test_xxx}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      NEXT_PUBLIC_GOOGLE_PICKER_API_KEY: ${NEXT_PUBLIC_GOOGLE_PICKER_API_KEY:-}
    ports:
      - "3300:3000"
    volumes:
      - ./uploads:/uploads

  paddleocr:
    build:
      context: ./apps/ocr-paddle
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

volumes:
  postgres_data:
